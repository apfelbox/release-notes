name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            # uses the version from the `packageManager` field in package.json
            -   name: Set up pnpm
                uses: pnpm/action-setup@v6

            -   name: Set up Node.js
                uses: actions/setup-node@v7
                with:
                    node-version-file: .node-version
                    cache: pnpm

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Build
                run: pnpm build

            -   name: Run tests
                run: pnpm test
